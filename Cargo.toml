[package]
name = "gamelo"
version = "0.1.0"
edition = "2024"
description = "A game launcher for Linux: your Windows games, stores, launchers and emulators in one place, no Steam needed"
license = "MIT"
repository = "https://github.com/barknq11/gamelo"

[dependencies]
arboard = "3.7.0"
eframe = { version = "0.37.0", default-features = false, features = [
    "glow",
    "default_fonts",
    "wayland",
    "x11",
    "clipboard",
] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
ar-reshaper = "1.5.0"
unicode-bidi = "0.3.18"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
