<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Noto Sans, Cantarell, sans-serif">
  <defs>
    <linearGradient id="sheetbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1A1224"/><stop offset="1" stop-color="#0B0810"/></linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFB86B"/><stop offset="0.5" stop-color="#FF6F98"/><stop offset="1" stop-color="#B46CFF"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#sheetbg)"/>
  <text x="80" y="92" fill="#8C7B92" font-size="20" letter-spacing="6" font-weight="600">BRAND SHEET</text>
  <!-- Logo -->
  <image x="80" y="140" width="360" height="360" xlink:href="gamelo-512.png"/>
  <text x="490" y="300" fill="#F7EEF4" font-size="150" font-weight="800" letter-spacing="-3">Gamelo</text>
  <rect x="496" y="330" width="230" height="10" rx="5" fill="url(#word)"/>
  <text x="496" y="400" fill="#C3B2C4" font-size="38">Your games, in one place</text>
  <text x="496" y="450" fill="#8C7B92" font-size="26">ألعابك في مكان واحد</text>
  <!-- Small sizes -->
  <text x="1180" y="180" fill="#8C7B92" font-size="18" letter-spacing="4" font-weight="600">SIZES</text>
  <image x="1180" y="205" width="128" height="128" xlink:href="gamelo-512.png"/>
  <image x="1330" y="237" width="64" height="64" xlink:href="gamelo-512.png"/>
  <image x="1416" y="253" width="32" height="32" xlink:href="gamelo-512.png"/>
  <image x="1468" y="261" width="16" height="16" xlink:href="gamelo-512.png"/>
  <text x="1180" y="380" fill="#8C7B92" font-size="18" letter-spacing="4" font-weight="600">IDEA</text>
  <text x="1180" y="418" fill="#C3B2C4" font-size="22">A “G” wrapped around a play</text>
  <text x="1180" y="448" fill="#C3B2C4" font-size="22">button: your games, ready to go.</text>
  <!-- Palette -->
  <text x="80" y="590" fill="#8C7B92" font-size="18" letter-spacing="4" font-weight="600">COLOUR</text>
  <g font-size="20">
    <rect x="80" y="615" width="200" height="140" rx="22" fill="#FFB86B"/><text x="80" y="790" fill="#F7EEF4" font-weight="700">Ember</text><text x="80" y="818" fill="#8C7B92">#FFB86B</text>
    <rect x="300" y="615" width="200" height="140" rx="22" fill="#FF6F98"/><text x="300" y="790" fill="#F7EEF4" font-weight="700">Gamelo Rose</text><text x="300" y="818" fill="#8C7B92">#FF6F98 · accent</text>
    <rect x="520" y="615" width="200" height="140" rx="22" fill="#B46CFF"/><text x="520" y="790" fill="#F7EEF4" font-weight="700">Dusk</text><text x="520" y="818" fill="#8C7B92">#B46CFF</text>
    <rect x="740" y="615" width="200" height="140" rx="22" fill="#2B1A3F" stroke="#3E2D52" stroke-width="2"/><text x="740" y="790" fill="#F7EEF4" font-weight="700">Plum</text><text x="740" y="818" fill="#8C7B92">#2B1A3F</text>
    <rect x="960" y="615" width="200" height="140" rx="22" fill="#120D19" stroke="#3E2D52" stroke-width="2"/><text x="960" y="790" fill="#F7EEF4" font-weight="700">Night</text><text x="960" y="818" fill="#8C7B92">#120D19 · base</text>
    <rect x="1180" y="615" width="200" height="140" rx="22" fill="#FFF3F7"/><text x="1180" y="790" fill="#F7EEF4" font-weight="700">Cream</text><text x="1180" y="818" fill="#8C7B92">#FFF3F7 · ink</text>
  </g>
  <rect x="1400" y="615" width="120" height="140" rx="22" fill="url(#word)"/><text x="1400" y="790" fill="#F7EEF4" font-size="20" font-weight="700">Glow</text><text x="1400" y="818" fill="#8C7B92" font-size="20">gradient</text>
  <text x="80" y="905" fill="#8C7B92" font-size="20">Themes in the app: Gamelo Night (default dark) and Gamelo Day (default light). Name always written “Gamelo” — capital G, never translated.</text>
</svg>
